pluginManagement {
    repositories {
        // KSP is published in Maven Central. Look there first.
        // Google Cloud's Maven Central mirror; the official repository remains below.
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        gradlePluginPortal()
    }
    // Resolve KSP using its published implementation module, rather than
    // relying on a Gradle plugin marker in the runner's repository mirrors.
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.google.devtools.ksp') {
                useModule("com.google.devtools.ksp:symbol-processing-gradle-plugin:${requested.version ?: '2.3.2'}")
            }
        }
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
        maven { url "https://jitpack.io" } // For StfalconImageViewer
    }
}

rootProject.name='ntfy'
include ':app'
