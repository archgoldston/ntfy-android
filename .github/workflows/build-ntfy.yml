name: Build single F-Droid release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Check KSP download sources
        shell: bash
        run: |
          set -euo pipefail
          artifact='com/google/devtools/ksp/symbol-processing-gradle-plugin/2.3.2/symbol-processing-gradle-plugin-2.3.2.pom'
          for base in 'https://maven-central.storage-download.googleapis.com/maven2' 'https://repo.maven.apache.org/maven2'; do
            echo "Checking $base"
            curl -L -sS --max-time 20 -o /dev/null -w 'HTTP %{http_code}\n' "$base/$artifact" || true
          done

      - name: Build F-Droid release only
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          for attempt in 1 2; do
            set +e
            ./gradlew :app:assembleFdroidRelease --no-daemon --stacktrace 2>&1 | tee gradle-build.log
            code=${PIPESTATUS[0]}
            set -e
            if [ "$code" -eq 0 ]; then exit 0; fi
            if [ "$attempt" -eq 2 ]; then exit "$code"; fi
            # Retry only when Gradle could not fetch a plugin/dependency.
            if ! grep -Eiq '(Plugin \[id:.*com\.google\.devtools\.ksp|Could not resolve|Could not GET|Read timed out|Connection reset|HTTP[^0-9]*(429|502|503|504))' gradle-build.log; then
              exit "$code"
            fi
            echo 'Dependency download error; retrying build once...'
            sleep 15
          done

      # Optional: for install-over-existing-APK updates, configure the four
      # NTFY_KEYSTORE_* repository secrets. Otherwise a temporary CI signing
      # key is generated and an update will require uninstalling the old APK.
      - name: Prepare APK signing
        shell: bash
        env:
          NTFY_KEYSTORE_BASE64: ${{ secrets.NTFY_KEYSTORE_BASE64 }}
          NTFY_KEYSTORE_PASSWORD: ${{ secrets.NTFY_KEYSTORE_PASSWORD }}
          NTFY_KEY_ALIAS: ${{ secrets.NTFY_KEY_ALIAS }}
          NTFY_KEY_PASSWORD: ${{ secrets.NTFY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$NTFY_KEYSTORE_BASE64" ]]; then
            : "${NTFY_KEYSTORE_PASSWORD:?Missing NTFY_KEYSTORE_PASSWORD}"
            : "${NTFY_KEY_ALIAS:?Missing NTFY_KEY_ALIAS}"
            : "${NTFY_KEY_PASSWORD:?Missing NTFY_KEY_PASSWORD}"
            printf '%s' "$NTFY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ntfy-signing.jks"
            echo 'NTFY_KEYSTORE_PATH='"$RUNNER_TEMP/ntfy-signing.jks" >> "$GITHUB_ENV"
            echo 'NTFY_SIGN_ALIAS='"$NTFY_KEY_ALIAS" >> "$GITHUB_ENV"
            echo 'NTFY_SIGN_STORE_PASS='"$NTFY_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo 'NTFY_SIGN_KEY_PASS='"$NTFY_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/ntfy-signing.jks" \
              -storepass android -keypass android -alias ntfy \
              -keyalg RSA -keysize 3072 -validity 10000 \
              -dname 'CN=ntfy Private Build, OU=Android, O=Personal, C=US'
            echo 'NTFY_KEYSTORE_PATH='"$RUNNER_TEMP/ntfy-signing.jks" >> "$GITHUB_ENV"
            echo 'NTFY_SIGN_ALIAS=ntfy' >> "$GITHUB_ENV"
            echo 'NTFY_SIGN_STORE_PASS=android' >> "$GITHUB_ENV"
            echo 'NTFY_SIGN_KEY_PASS=android' >> "$GITHUB_ENV"
          fi

      - name: Sign and verify one APK
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' app/build.gradle | head -n 1)"
          [[ -n "$VERSION" ]] || { echo 'Could not find versionName'; exit 1; }
          INPUT_APK="$(find app/build/outputs/apk/fdroid/release -maxdepth 1 -name '*-unsigned.apk' -type f | head -n 1)"
          [[ -n "$INPUT_APK" ]] || { echo 'Unsigned F-Droid release APK not found'; exit 1; }
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          [[ -x "$APKSIGNER" ]] || { echo 'apksigner not found'; exit 1; }
          mkdir -p dist
          OUT="dist/ntfy-${VERSION}-fdroid-release.apk"
          "$APKSIGNER" sign \
            --ks "$NTFY_KEYSTORE_PATH" \
            --ks-key-alias "$NTFY_SIGN_ALIAS" \
            --ks-pass "env:NTFY_SIGN_STORE_PASS" \
            --key-pass "env:NTFY_SIGN_KEY_PASS" \
            --out "$OUT" "$INPUT_APK"
          "$APKSIGNER" verify --verbose "$OUT"
          [[ "$(find dist -maxdepth 1 -name '*.apk' -type f | wc -l)" -eq 1 ]]

      - name: Upload only the final APK
        uses: actions/upload-artifact@v4
        with:
          name: ntfy-fdroid-release
          path: dist/*.apk
          if-no-files-found: error
